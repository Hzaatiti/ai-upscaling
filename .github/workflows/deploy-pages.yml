name: Deploy slides to GitHub Pages

# Publishes the combined workshop site on every push to main.
# The live interactive deck for each workshop ends up at:
#   https://<owner>.github.io/<repo>/<NN-slug>/
# with a landing index at the site root and downloadable PDF/PPTX beside each deck.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Required for the GitHub Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; let a newer push cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The Slidev theme (slidev-theme-nyu) is vendored inside this repo at
      # theme/ and consumed via a `file:../../theme` dependency, so a single
      # checkout is all the layout CI needs.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        # --no-frozen-lockfile keeps CI green even if the lockfile lags behind
        # a package.json edit; commit an updated lockfile to make this strict.
        run: pnpm install --no-frozen-lockfile

      - name: Install Playwright Chromium (for PDF and PPTX export)
        run: pnpm exec playwright install --with-deps chromium

      - name: Build combined site
        # Base path is derived from $GITHUB_REPOSITORY -> "/<repo>/".
        run: node scripts/ci-build.mjs --mode pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
